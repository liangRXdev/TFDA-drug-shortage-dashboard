name: FDA Data Fetch & Update

on:
  schedule:
    # 台灣時間每週五凌晨 02:00 (UTC 時間週四 18:00)
    - cron: '0 18 * * 4'
  workflow_dispatch: # 允許手動觸發測試

# 停更偵測的 frozen_runs 是唯一的跨執行狀態，且以 repo 已接受的 payload 為基準。
# 兩個 ETL 並行會讀到同一份前版、各自算出新狀態，較晚完成者可能覆蓋較新結果。
# 在無伺服器狀態的靜態管線上不自建狀態承接協議，改在排程層序列化（比照 deploy.yml）。
concurrency:
  group: fda-data-update
  cancel-in-progress: false   # 排隊而非取消：每個觀測區間都要留下結果

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 允許寫入 Repository

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Execute Data Fetch Script
        # 將執行專案目錄下的 python 腳本
        run: python scripts/fetch_fda_data.py

      - name: Commit and Push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          # 若資料無變動則跳過 commit
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update FDA drug supply data" && git push)
